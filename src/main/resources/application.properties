spring.application.name=citas
server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3306/db_clinica

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
eureka.client.serviceUrl.defaultZone=http://localhost:8085/eureka/
spring.config.import=configserver:http://localhost:8085/config